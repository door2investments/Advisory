<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Client Profile | Admin</title>
  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Branding -->
  <header class="brand-header">
    <h1>Wealth & Investment Advisory</h1>
    <p>Client Profile (Admin View)</p>
  </header>

  <main class="container">

    <!-- CLIENT IDENTITY -->
    <section class="card">
      <h2>Client Information</h2>
      <div class="grid-2">
        <div><label>Name: </label><span id="full_name"></span></div>
        <div><label>Mobile: </label><span id="mobile_number"></span></div>
        <div><label>Email: </label><span id="email"></span></div>
        <div><label>Date of Birth: </label><span id="date_of_birth"></span></div>
        <div><label>Gender: </label><span id="gender"></span></div>
        <div><label>Marital Status: </label><span id="marital_status"></span></div>
        <div><label>Profession: </label><span id="profession"></span></div>
        <div><label>Dependents: </label><span id="dependents"></span></div>
        <div><label>Created Date: </label><span id="created_date"></span></div>
      </div>
    </section>

    <!-- FINANCIAL SNAPSHOT -->
    <section class="card">
      <h2>Monthly Financial Snapshot</h2>
      <div class="grid-2">
        <div><label>Monthly Savings: </label><span id="monthly_savings"></span></div>
        <div><label>Monthly Expenses: </label><span id="monthly_expenses"></span></div>
        <div><label>Insurance & EMIs: </label><span id="insurance_and_emis"></span></div>
        <div><label>Family Responsibility: </label><span id="family_responsibility"></span></div>
      </div>
    </section>

    <!-- ASSETS -->
    <section class="card">
      <h2>Assets & Protection</h2>
      <div class="grid-2">
        <div><label>Assets Held: </label><span id="assets_held"></span></div>
        <div><label>Health Insurance: </label><span id="health_insurance"></span></div>
        <div><label>Term Insurance: </label><span id="term_insurance"></span></div>
        <div><label>Retirement Planned: </label><span id="retirement_planned"></span></div>
      </div>
    </section>

    <!-- BEHAVIOUR -->
    <section class="card">
      <h2>Investment Behaviour</h2>
      <div class="grid-2">
        <div><label>Invested Before: </label><span id="invested_before"></span></div>
        <div><label>Experience: </label><span id="investment_experience"></span></div>
        <div><label>Knowledge Level: </label><span id="investment_knowledge"></span></div>
        <div><label>Decision Maker: </label><span id="decision_maker"></span></div>
        <div><label>Market Fall Response: </label><span id="market_fall_response"></span></div>
        <div><label>Sold Due to Fear: </label><span id="sold_due_to_fear"></span></div>
        <div><label>Loss Reaction: </label><span id="loss_reaction"></span></div>
        <div><label>Tracking Frequency: </label><span id="tracking_frequency"></span></div>
      </div>
    </section>

    <!-- GOALS -->
    <section class="card">
      <h2>Goals & Planning</h2>
      <div class="grid-2">
        <div><label>Short Term Goal: </label><span id="short_term_goal"></span></div>
        <div><label>Short Term Amount: </label><span id="short_term_amount"></span></div>

        <div><label>Medium Term Goal: </label><span id="medium_term_goal"></span></div>
        <div><label>Medium Term Amount: </label><span id="medium_term_amount"></span></div>

        <div><label>Long Term Goal: </label><span id="long_term_goal"></span></div>
        <div><label>Long Term Amount: </label><span id="long_term_amount"></span></div>

        <div><label>Investment Objective: </label><span id="investment_objective"></span></div>
        <div><label>Investment Horizon: </label><span id="investment_horizon"></span></div>
        <div><label>Investment Mode: </label><span id="investment_mode"></span></div>
        <div><label>Advisor Expectation: </label><span id="advisor_expectation"></span></div>
      </div>
    </section>

  </main>
  
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <script src="admin-client.js"></script>
</body>
</html>
