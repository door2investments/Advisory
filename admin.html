<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Client Links | Wealth & Investment Advisory</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: Inter, sans-serif;
      background: #f4f6fb;
      color: #1f2937;
    }

    /* Branding */
    .brand-header {
      background: #e6f4ef;
      border-bottom: 1px solid #dbe7e2;
    }
    .brand-container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
      display: flex;
      align-items: center;
    }
    .brand-left h1 {
      margin: 0;
      font-size: 22px;
      color: #0f2a44;
    }
    .brand-sub {
      font-size: 13px;
      color: #475569;
    }

    /* Page */
    .page {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    h2 {
      margin-bottom: 16px;
      color: #0f2a44;
    }

    /* Table */
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(15,42,68,.08);
    }

    thead {
      background: #0f2a44;
      color: #fff;
    }

    th, td {
      padding: 12px 14px;
      font-size: 14px;
      text-align: left;
    }

    tbody tr {
      border-bottom: 1px solid #e5e7eb;
    }

    tbody tr:hover {
      background: #f8fafc;
    }

    a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }

    a:hover {
      text-decoration: underline;
    }

    .copy {
      font-size: 12px;
      color: #475569;
      cursor: pointer;
    }
/* ===============================
   MODAL
================================ */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(15, 42, 68, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal.hidden {
  display: none;
}

.modal-content {
  background: #ffffff;
  width: 100%;
  max-width: 420px;
  border-radius: 14px;
  padding: 24px 28px;
  box-shadow: 0 20px 40px rgba(0,0,0,.2);
}

.modal-content h3 {
  margin-top: 0;
  margin-bottom: 14px;
  color: #0f2a44;
}

.modal-field {
  margin-bottom: 14px;
}

.modal-field label {
  display: block;
  font-size: 13px;
  margin-bottom: 6px;
}

.modal-field input,
.modal-field textarea {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #d1d5db;
  font-size: 14px;
}

.modal-field textarea {
  min-height: 90px;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 16px;
}

.modal-actions button {
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  font-size: 14px;
  cursor: pointer;
}

.modal-actions .secondary {
  background: #e5e7eb;
}

.modal-actions button:not(.secondary) {
  background: #0f2a44;
  color: white;
}

/* Mobile */

@media (max-width: 768px) {
.modal-content {
    margin: 0 14px;
  }
  table {
    display: block;
    background: none;
    box-shadow: none;
  }

  thead {
    display: none;
  }

  tbody {
    display: block;
  }

  tbody tr {
    display: block;
    background: #ffffff;
    margin-bottom: 14px;
    padding: 12px 14px;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(15,42,68,.06);
  }

  tbody td {
    display: block;
    padding: 6px 0;
    font-size: 13px;
    border: none;
  }

  tbody td::before {
    content: attr(data-label);
    display: block;
    font-weight: 600;
    font-size: 12px;
    color: #475569;
    margin-bottom: 2px;
  }
}

  </style>
</head>
<body>

<header class="brand-header">
  <div class="brand-container">
    <div class="brand-left">
      <h1>Wealth & Investment Advisory</h1>
      <div class="brand-sub">Client Access Links</div>
    </div>
  </div>
</header>

<div class="page">
  <h2>Client Summary Links</h2>

  <table>
    <thead>
      <tr>
        <th>Client Name</th>
        <th>Mobile</th>
        <th>Client URL</th>
        <th>Add Observation</th>
      </tr>
    </thead>
    <tbody id="clientsBody"></tbody>
  </table>
</div>
<!-- ===============================
     ADD OBSERVATION MODAL
================================ -->
<div id="observationModal" class="modal hidden">
  <div class="modal-content">
    <h3>Add Advisor Observation</h3>

    <div class="modal-field">
      <label>Client Name</label>
      <input type="text" id="modal_client_name" disabled />
    </div>

    <div class="modal-field">
      <label>Mobile Number</label>
      <input type="text" id="modal_mobile" disabled />
    </div>

    <div class="modal-field">
      <label>Observation Date</label>
      <input type="date" id="modal_date" />
    </div>

    <div class="modal-field">
      <label>Observation</label>
      <textarea
        id="modal_text"
        placeholder="Enter advisor observation or recommendation"
      ></textarea>
    </div>

    <div class="modal-actions">
      <button class="secondary" onclick="closeModal()">Cancel</button>
      <button onclick="saveObservation()">Save</button>
    </div>

    <div id="modalMessage"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="admin.js"></script>
</body>
</html>
