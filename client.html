<!DOCTYPE html>
<html>
<head>

</head>
<body>

<div class="container">
  <div class="card">
    <h2 id="name">Client Name</h2>
    <p id="basic"></p>

  <div class="card">

    <p>Short Term: <strong id="shortGoal"></strong></p>

    <p>Long Term: <strong id="longGoal"></strong></p>

  <div class="card">
    <h3>Insurance Status</h3>
    <p>Health Insurance: <strong id="health"></strong></p>
    <p>Term Insurance: <strong id="term"></strong></p>

  <footer>
    Wealth & Investment Advisory<br>
    Mutual fund investments are subject to market risks.
  </footer>
</div>

<script src="client.js"></script>
</body>
</html>
